name: Build Postiz CNS

on:
  push:
    branches: [main, cns]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/postiz-cns

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dev
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_VERSION=${{ github.sha }}

  # Optional: after a successful image push, remind deploy (manual on VPS for now)
  summary:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Image ready: ghcr.io/${{ github.repository_owner }}/postiz-cns:latest"
          echo "On VPS:"
          echo "  docker pull ghcr.io/${{ github.repository_owner }}/postiz-cns:latest"
          echo "  # set image in ~/postiz/docker-compose.yaml then:"
          echo "  cd ~/postiz && docker compose up -d --force-recreate postiz"
